name: Discord通知

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, ready_for_review, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Discordに送る
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          COMMITS: ${{ toJSON(github.event.commits) }}
          COMPARE_URL: ${{ github.event.compare }}
          PR_ACTION: ${{ github.event.action }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # PRマージ由来のpushはPR側で通知するのでスキップ
            [[ "$HEAD_MSG" == "Merge pull request"* ]] && exit 0
            LIST=$(echo "$COMMITS" | jq -r '[.[] | select(.message | startswith("Merge") | not) | "・" + (.message | split("\n")[0])] | join("\n")')
            URL="$COMPARE_URL"
            if [ "$BRANCH" = "main" ]; then
              TITLE="⚠️ mainが直接更新された"
              DESC="${ACTOR} がmainに直接pushしたよ"$'\n\n'"${LIST}"
              NEXT="git pull origin main で最新にしてね（本来はPR経由で！）"
              COLOR=15548997
            else
              TITLE="🛠 ${ACTOR} が ${BRANCH} で作業中"
              DESC="$LIST"
              NEXT="対応不要（見るだけでOK）"
              COLOR=9807270
            fi

          elif [ "$EVENT" = "pull_request" ]; then
            URL="$PR_URL"
            if [ "$PR_ACTION" = "closed" ]; then
              [ "$PR_MERGED" != "true" ] && exit 0   # マージされずに閉じたものは通知しない
              TITLE="✅ mainに取り込まれた：${PR_TITLE}"
              DESC="${ACTOR} が ${PR_HEAD} をmainにマージしたよ"
              NEXT="作業を始める前に git switch main → git pull origin main"
              COLOR=5763719
            else
              [ "$PR_DRAFT" = "true" ] && exit 0      # 下書きPRは通知しない
              TITLE="👀 レビュー依頼：${PR_TITLE}"
              DESC="${ACTOR} が ${PR_HEAD} → main のPRを出したよ"
              NEXT="誰か1人、中身を見て Approve してあげて"
              COLOR=3447003
            fi
          fi

          jq -n --arg t "$TITLE" --arg d "$DESC" --arg n "$NEXT" --arg u "$URL" --argjson c "$COLOR" \
            '{embeds:[{title:$t, description:$d, url:$u, color:$c,
                       fields:[{name:"👉 みんながやること", value:$n}]}]}' \
          | curl -sS -H "Content-Type: application/json" -d @- "$WEBHOOK"